# ---- Single source of truth. Edit here only. ----
zt_network_id: "REPLACE_WITH_YOUR_16_CHAR_NETWORK_ID"
zt_subnet: "10.0.1.0/24"
internal_vip: "10.0.1.5"          # reserved for Kolla/Keepalived, NOT assigned to any node

timezone: "UTC"
base_packages: [chrony, python3-pip, python3-venv, python3-dev, libffi-dev, gcc, libssl-dev,
                git, curl, jq, net-tools, nfs-common, lvm2, xfsprogs, cpu-checker]
upgrade_packages: true

# Preflight policy (lab-grade: latency is a warning, heavy loss is a blocker)
mtu_probe_payload: 1372           # 1372 + 28 = 1400-byte IPv4 packet
max_loss_pct: 20
latency_warn_ms: 50
min_mem_mb: { controller: 14000, compute1: 8000, storage: 7000 }
min_cpus: 4

# Compute
provider_nic: ens37               # 2nd NIC (VMnet10), up, NO IP - reserved for OVS/Neutron

# Storage (verify with lsblk before running!)
os_disk: /dev/sda
cinder_disk: /dev/sdb
swift_disk: /dev/sdc
cinder_vg: cinder-volumes
glance_export_dir: /srv/glance-images

# ================= Vol 2: Kolla-Ansible =================
kolla_venv: /opt/kolla-venv
kolla_user: "{{ hostvars['controller']['ansible_user'] }}"
kolla_ansible_spec: ">=19,<20"          # 19.x = OpenStack 2024.2
ansible_core_spec: ">=2.16,<2.18"
openstack_release: "2024.2"
kolla_distro: "ubuntu"
min_root_free_gb: 12                    # Kolla container images are big

# Optional services (kept off: compute1 has 9 GB RAM)
enable_heat: "no"
enable_swift: "no"                      # disk is prepared; ring build comes in a later volume

# Glance images stored on storage's NFS export (prepared in Vol 1)
glance_use_nfs: true
glance_nfs_mount: /mnt/glance-images
glance_uid: 42415                       # uid/gid of 'glance' inside Kolla containers

# ---- Provider network (VMnet10) --> CHECK against VMware Virtual Network Editor / ipconfig on the compute PC
provider_cidr: "172.24.4.0/24"
provider_gateway: "172.24.4.1"          # = the PC's VMnet10 host adapter IP
provider_pool_start: "172.24.4.100"
provider_pool_end: "172.24.4.200"

# ---- Self-service (tenant) network, VXLAN
tenant_cidr: "10.20.0.0/24"
tenant_gateway: "10.20.0.1"
tenant_dns: "1.1.1.1"
