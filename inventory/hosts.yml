# Group names deliberately differ from host names (avoids Ansible's host/group clash warning).
all:
  vars:
    ansible_user: stack
  children:
    openstack_nodes:
      hosts:
        controller:
          ansible_host: 10.0.1.4
          node_ip: 10.0.1.4
        compute1:
          ansible_host: 10.0.1.6
          node_ip: 10.0.1.6
        storage:
          ansible_host: 10.0.1.7
          node_ip: 10.0.1.7
    g_control:
      hosts: { controller: }
    g_compute:
      hosts: { compute1: }
    g_storage:
      hosts: { storage: }
