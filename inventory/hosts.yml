# Group names deliberately differ from host names (avoids Ansible's host/group clash warning).
# Each node has its own Linux account (user@host = controller@controller, compute1@compute1, storage@storage).
all:
  children:
    openstack_nodes:
      hosts:
        controller:
          ansible_host: 10.0.1.4
          ansible_user: controller
          node_ip: 10.0.1.4
        compute1:
          ansible_host: 10.0.1.6
          ansible_user: compute1
          node_ip: 10.0.1.6
        storage:
          ansible_host: 10.0.1.7
          ansible_user: storage
          node_ip: 10.0.1.7
    g_control:
      hosts: { controller: }
    g_network:
      hosts: { compute1: }   # L3/DHCP/metadata agents live where the provider NIC is
    g_compute:
      hosts: { compute1: }
    g_storage:
      hosts: { storage: }
