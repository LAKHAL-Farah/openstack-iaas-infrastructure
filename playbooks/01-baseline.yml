- hosts: openstack_nodes
  become: true
  tasks:
    - name: Hostname matches inventory
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Cluster name resolution
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} OPENSTACK-LAB"
        block: |
          {% for h in groups['openstack_nodes'] %}
          {{ hostvars[h].node_ip }} {{ h }}
          {% endfor %}

    - name: Timezone
      community.general.timezone:
        name: "{{ timezone }}"

    - name: Update cache and install packages
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        name: "{{ base_packages }}"
        upgrade: "{{ 'dist' if upgrade_packages else 'no' }}"

    - name: Time sync enabled
      ansible.builtin.service:
        name: chrony
        state: started
        enabled: true

    - name: Swap off now
      ansible.builtin.command: swapoff -a
      when: ansible_swaptotal_mb > 0
      changed_when: true

    - name: Swap off permanently
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    - name: Reboot needed?
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_flag

    - name: Reboot if kernel/libs updated
      ansible.builtin.reboot:
        reboot_timeout: 600
      when: reboot_flag.stat.exists
